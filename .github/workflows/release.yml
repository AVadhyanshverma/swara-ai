name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Install requirements if it exists, otherwise install core dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install fastapi uvicorn langchain_openai langchain_core pydantic; fi
      shell: bash

    - name: Build with PyInstaller
      run: |
        pyinstaller build.spec
      shell: bash

    - name: Rename artifacts
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          mv dist/SwaraAI.exe dist/SwaraAI-Windows.exe
        else
          mv dist/swara-ai dist/swara-ai-linux
        fi
      shell: bash

    - name: Upload Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }}
        path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/*
        generate_release_notes: true

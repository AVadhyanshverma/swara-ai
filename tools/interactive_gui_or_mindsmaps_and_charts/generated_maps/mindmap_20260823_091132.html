# Web Dev Tech Stack

## Frontend (What users see)
- HTML
  - Structure of pages
  - Semantic tags
- CSS
  - Styling & layout
  - Flexbox & Grid
- JavaScript
  - Interactivity
  - ES6+ features
  - DOM manipulation

## Backend (Server logic)
- Language choices
  - Node.js (JavaScript)
  - Python (Flask/Django)
  - PHP
- Frameworks
  - Express (Node)
  - Django / Flask (Python)
- REST APIs
  - JSON responses
  - HTTP methods (GET, POST...)

## Database (Storing data)
- SQL (Relational)
  - SQLite (for beginners)
  - PostgreSQL / MySQL
- NoSQL
  - MongoDB

## Version Control
- Git
  - Init, add, commit
  - Branching & merging
- GitHub
  - Push & pull
  - Pull requests

## Tools & Environment
- Code editor (VS Code)
- Terminal / CLI basics
- Browser DevTools
- Package managers (npm / pip)

## Optional: Learn Next
- React (frontend framework)
- Responsive design
- Deployment (Netlify / Vercel)
- Authentication basics
